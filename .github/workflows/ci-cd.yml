name: SmartHire AI CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword2026
          POSTGRES_DB: smarthire_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_SERVER: localhost
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword2026
      POSTGRES_DB: smarthire_db
      POSTGRES_PORT: 5432
      USE_SQLITE: "false"
      DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword2026@localhost:5432/smarthire_db
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
      - name: Initialize Database Schema
        run: |
          cd backend
          python ensure_db_schema.py
      - name: Run Pytest Test Suite
        run: |
          cd backend
          PYTHONPATH=. python -m pytest app/tests/

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Node.js 20
        uses: actions/setup-node@v3
        with:
          node-version: '20'
      - name: Install dependencies & build
        run: |
          cd frontend
          npm install
          npm run build

  docker-build:
    needs: [backend-tests, frontend-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Build Docker Containers
        run: |
          docker compose build
