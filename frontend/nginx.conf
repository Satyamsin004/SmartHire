server {
    listen 80;
    server_name localhost;

    # High-Performance Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Immutable Cache for Vite Versioned Static Assets
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Support Large Interview Video/Audio Uploads
    client_max_body_size 500M;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_connect_timeout 600s;

    location /api/ {
        proxy_pass https://smarthire-production-675e.up.railway.app/api/;
        proxy_ssl_server_name on;
        proxy_ssl_name smarthire-production-675e.up.railway.app;
        proxy_set_header Host smarthire-production-675e.up.railway.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        client_max_body_size 500M;
        # Explicit timeouts — server-level directives do NOT cascade into location blocks
        # Railway AI generation (questions) can take 60-120s; submit evaluation ~5-15s
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 30s;
    }

    location /ws/ {
        proxy_pass https://smarthire-production-675e.up.railway.app/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_ssl_server_name on;
        proxy_ssl_name smarthire-production-675e.up.railway.app;
        proxy_set_header Host smarthire-production-675e.up.railway.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location /health {
        proxy_pass https://smarthire-production-675e.up.railway.app/health;
        proxy_ssl_server_name on;
        proxy_ssl_name smarthire-production-675e.up.railway.app;
        proxy_set_header Host smarthire-production-675e.up.railway.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /uploads/ {
        proxy_pass https://smarthire-production-675e.up.railway.app/uploads/;
        proxy_ssl_server_name on;
        proxy_ssl_name smarthire-production-675e.up.railway.app;
        proxy_set_header Host smarthire-production-675e.up.railway.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        client_max_body_size 500M;
    }
}
